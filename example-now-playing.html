<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Now Playing</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Microlink Vanilla JS -->
    <script src="https://cdn.jsdelivr.net/npm/@microlink/vanilla/umd/microlink.min.js"></script>

    <style>
        /* Custom Club/Stage Ambient Background */
        body {
            background-color: #050505;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(76, 29, 149, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(29, 78, 216, 0.15), transparent 25%);
            animation: pulse-ambient 10s infinite alternate ease-in-out;
        }

        @keyframes pulse-ambient {
            0% {
                background-position: 0% 0%, 0% 0%;
            }

            100% {
                background-position: 5% 5%, -5% -5%;
            }
        }

        /* Scale up the Microlink card to act as a large display poster/record sleeve */
        #stage-area {
            /* Base scale */
            transform: scale(1.1);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (min-width: 768px) {
            #stage-area {
                transform: scale(1.5);
            }
        }

        @media (min-width: 1024px) {
            #stage-area {
                transform: scale(1.8);
            }
        }

        /* Add a glowing shadow behind the record sleeve */
        .glow-effect {
            box-shadow: 0 0 80px rgba(139, 92, 246, 0.2), 0 0 30px rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            background: #111;
            /* Fallback for empty state */
        }

        /* Overriding Microlink defaults slightly to ensure it looks pristine on dark mode */
        .microlink_card {
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            background-color: #1a1a1a !important;
            color: #fff !important;
            border-radius: 12px !important;
            overflow: hidden;
        }

        .microlink_card__content {
            background-color: #1a1a1a !important;
        }

        .microlink_card__content_title,
        .microlink_card__content_description {
            color: #eee !important;
        }
    </style>
</head>

<body
    class="text-white overflow-hidden font-sans h-screen w-full flex flex-col selection:bg-purple-600 selection:text-white relative antialiased">

    <!-- Main Display Stage -->
    <main class="flex-1 flex items-center justify-center w-full h-full p-4 z-0">
        <div id="stage-area" class="glow-effect flex items-center justify-center">

            <!-- ========================================================================= -->
            <!-- 💿 UPDATE YOUR URL HERE 💿                                                -->
            <!-- Change the 'href' link below to your desired track URL.                   -->
            <!-- Examples: Spotify, Apple Music, SoundCloud, YouTube links work perfectly. -->
            <!-- ========================================================================= -->

            <a href="https://soundcloud.com/sutrofm/celluloid-mixtape-09-begotten" class="microlink-target"></a>

            <!-- ========================================================================= -->

        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Automatically initialize Microlink on the target anchor tag when the page loads
            microlink('.microlink-target', {
                size: 'large', // Generates the large "record sleeve" layout with image on top
                media: ['image', 'logo'], // Emphasize visual cover art
                iframe: false, // We want the rich card picture, not an embed player that requires interaction
            });
        });
    </script>
</body>

</html>
